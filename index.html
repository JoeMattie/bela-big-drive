<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1424">
  <title>Bela's Big Drive</title>
  <meta name="description" content="A pixel-art road trip survival game: one 1999 Class A RV, two humans, a bull terrier and two cats, San Diego to Portland.">
  <link rel="icon" href="assets/ui/favicon.png">
  <link rel="apple-touch-icon" href="assets/ui/icon192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Bela's Big Drive">
  <meta property="og:description" content="San Diego to Portland in a 1999 Class A RV with two humans, a bull terrier and two cats. A pixel-art road trip survival game.">
  <meta property="og:image" content="https://joemattie.github.io/bela-big-drive/assets/ui/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    @font-face { font-family: 'HeadPixelCSS'; src: url(assets/fonts/PressStart2P-Regular.ttf); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #1b1424; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; outline: none; }
    noscript { color: #f7ecd2; font-family: monospace; }
    #corner { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 6px); top: calc(env(safe-area-inset-top, 0px) + 6px);
      display: flex; gap: 6px; z-index: 3; opacity: .45; }
    #corner:hover { opacity: 1; }
    #corner button { border: 1px solid #c8873a; background: #2e2140cc; color: #f7ecd2; font-family: 'HeadPixelCSS', monospace;
      font-size: 8px; padding: 6px 7px; cursor: pointer; border-radius: 3px; }
    #corner button.off { text-decoration: line-through; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="300" tabindex="0"></canvas>
  <noscript>This game needs JavaScript.</noscript>
  <script>window.BBD_VERSION = '3';</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
